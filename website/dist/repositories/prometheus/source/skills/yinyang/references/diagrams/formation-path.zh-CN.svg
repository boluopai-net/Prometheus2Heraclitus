--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="635" y="182.0">相遇</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="26" font-weight="500"><tspan x="635" y="270.0">共同反思</tspan></text><circle cx="635" cy="575" r="106" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="635" y="497.0">形成</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="26" font-weight="500"><tspan x="635" y="549.6">哲学与方向</tspan><tspan x="635" y="585.0">人、伙伴</tspan><tspan x="635" y="620.4">与关系模型</tspan></text><circle cx="165" cy="575" r="106" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="165" y="497.0">实践</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="26" font-weight="500"><tspan x="165" y="567.3">环境与作品</tspan><tspan x="165" y="602.7">新的相遇</tspan></text><circle cx="400" cy="390" r="92" fill="var(--paper)" stroke="var(--water)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="27" font-weight="500"><tspan x="400" y="371.6">人与模型</tspan><tspan x="400" y="408.4">共同实践</tspan></text><rect x="277.0" y="282.8" width="56.0" height="24.5" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="305" y="295.0">留下</tspan></text><rect x="370.0" y="223.4" width="60.0" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="20" font-weight="400"><tspan x="400" y="237.0">回看</tspan></text><rect x="625.5" y="404.6" width="115.0" height="25.8" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="19" font-weight="400"><tspan x="683" y="417.5">写出与凝练</tspan></text><rect x="370.0" y="588.4" width="60.0" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="20" font-weight="400"><tspan x="400" y="602.0">构建</tspan></text><rect x="256.5" y="482.3" width="56.0" height="24.5" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="284.5" y="494.5">使用</tspan></text><rect x="507.0" y="367.1" width="96.0" height="25.8" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="19" font-weight="400"><tspan x="555" y="380.0">修订理解</tspan></text><rect x="77.5" y="404.6" width="77.0" height="25.8" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="19" font-weight="400"><tspan x="116" y="417.5">新经验</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="400.0" y="25.0">起点</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="28" font-weight="500"><tspan x="400.0" y="72.0">参加窃火，用火培养自己</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="21" font-weight="400"><tspan x="400.0" y="734.0">新的经验，也会改变最初的培养方向。</tspan></text></svg>