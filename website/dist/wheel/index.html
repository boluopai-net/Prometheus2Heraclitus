<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽卡转盘 · boluopai.</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/mark.svg"><link rel="stylesheet" href="/wheel/picker.css"><script src="/wheel/picker.js" defer></script></head><body><header class="header wrap"></header><main class="wrap"><div class="picker"><section class="selection-panel"><h1>今天选什么？</h1><div class="mode-switch"><button id="catalog-mode" aria-pressed="true">现有清单</button><button id="free-mode" aria-pressed="false">自由输入</button></div><div id="free-input" hidden><label for="options">一行一个选项</label><textarea id="options" maxlength="20100"></textarea></div><div class="actions"><button id="all">全选</button><button id="none">反选</button><button id="delete">删除</button></div><p id="message" role="status"></p><div id="choices"></div><form id="add-option"><label for="new-option">添加选项</label><div class="add-row"><input id="new-option" maxlength="200" required><button type="submit">添加</button></div></form><p class="hint">每项机会相同。清单和选择只保存在当前浏览器，不影响其他人；清理网站数据后会丢失。</p></section><section class="wheel-panel"><p id="empty">先添加几个选项，再转。</p><iframe id="wheel" title="抽卡转盘" sandbox="allow-scripts" hidden></iframe></section></div></main><footer class="footer wrap"><a class="wordmark" href="/">boluopai.</a><p class="copyright"></p></footer></body></html>
