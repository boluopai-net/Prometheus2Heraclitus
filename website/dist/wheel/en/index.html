<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draw wheel · boluopai.</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/mark.svg"><link rel="stylesheet" href="/wheel/picker.css"><script src="/wheel/picker.js" defer></script></head><body><header class="header wrap"></header><main class="wrap"><div class="picker"><section class="selection-panel"><h1>What will it be?</h1><div class="mode-switch"><button id="catalog-mode" aria-pressed="true">Saved list</button><button id="free-mode" aria-pressed="false">Free input</button></div><div id="free-input" hidden><label for="options">One option per line</label><textarea id="options" maxlength="20100"></textarea></div><div class="actions"><button id="all">Select all</button><button id="none">Invert selection</button><button id="delete">Delete selected</button></div><p id="message" role="status"></p><div id="choices"></div><form id="add-option"><label for="new-option">Add an option</label><div class="add-row"><input id="new-option" maxlength="200" required><button type="submit">Add</button></div></form><p class="hint">Every option has an equal chance. Your list and selection stay only in this browser and do not affect anyone else. Clearing site data removes them.</p></section><section class="wheel-panel"><p id="empty">Add a few options to start.</p><iframe id="wheel" title="Draw wheel" sandbox="allow-scripts" hidden></iframe></section></div></main><footer class="footer wrap"><a class="wordmark" href="/">boluopai.</a><p class="copyright"></p></footer></body></html>
