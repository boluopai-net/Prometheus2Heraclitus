<!doctype html>
<html lang="zh-CN">
<head><link rel="canonical" href="https://boluopai.net/wheel/engine.html"><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机转盘</title>
  <style>
    :root { color-scheme: light dark; --background: #ffffff; --foreground: #202124; --accent: #e6eefb; --muted-foreground: #60646c; --primary: #202124; --primary-foreground: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --background: #191b20; --foreground: #f0f1f3; --accent: #293a54; --muted-foreground: #b1b5bf; --primary: #f0f1f3; --primary-foreground: #191b20; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--background); color: var(--foreground); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 680px; margin: auto; }
    h3 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
    .viz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .text-small { font-size: 13px; }
    .text-muted { color: var(--muted-foreground); }
    .form-label { display: block; }
    .form-range { display: block; width: 100%; margin: 12px 0; accent-color: var(--foreground); min-height: 24px; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .btn { font: inherit; padding: 9px 18px; border: 0; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); }
    .btn:disabled { opacity: .5; cursor: default; }
  
:root{color-scheme:light;--background:#f7f4ed;--foreground:#292a26;--accent:#e7e2d5;--muted-foreground:#66685f;--primary:#355a59;--primary-foreground:#fff}button:focus-visible,input:focus-visible{outline:2px solid #a4422c;outline-offset:3px}
</style>
</head>
<body><main><div id="public-wheel">
  <style>
    #public-wheel .wheel-area { position: relative; max-width: 340px; margin: 16px auto; }
    #public-wheel .wheel-face { display: block; width: 100%; overflow: visible; }
    #public-wheel .wheel-pointer { position: absolute; top: -9px; left: calc(50% - 10px); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 22px solid var(--foreground); z-index: 1; }
    #public-wheel .wheel-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 16px; margin: 16px 0 0; padding: 0; list-style: none; }
    #public-wheel .wheel-options li { overflow-wrap: anywhere; }
    #public-wheel .wheel-options li[aria-current="true"] { font-weight: 500; color: var(--foreground); background: var(--accent); }
    #public-wheel .wheel-result { text-align: center; min-height: 2em; }
    #public-wheel .speed { max-width: 340px; margin: 12px auto; }
    @media (max-width: 380px) { #public-wheel .wheel-options { grid-template-columns: 1fr; } }
  
:root{color-scheme:light;--background:#f7f4ed;--foreground:#292a26;--accent:#e7e2d5;--muted-foreground:#66685f;--primary:#355a59;--primary-foreground:#fff}button:focus-visible,input:focus-visible{outline:2px solid #a4422c;outline-offset:3px}
</style>
  <h3 data-label="heading">让转盘选一个</h3>
  <div class="wheel-result" role="status" aria-live="polite" data-label="ready">准备转动…</div>
  <div class="wheel-area">
    <div class="wheel-pointer" aria-hidden="true"></div>
    <svg class="wheel-face" viewBox="0 0 340 340" role="img" aria-label="等概率随机转盘，顶部指针指向选中的编号" data-label-attr="aria-label:wheelAria">
      <g class="wheel-disc"></g>
      <circle cx="170" cy="170" r="41" fill="var(--background)" />
      <text x="170" y="175" text-anchor="middle" fill="var(--foreground)" data-label="center">随机选择</text>
    </svg>
  </div>
  <div class="speed">
    <label class="form-label"><span data-label="speed">转速</span> <output class="tabular-nums">3×</output>
      <input class="form-range" type="range" min="0.25" max="3" step="0.25" value="3" aria-label="转速" data-label-attr="aria-label:speed" />
    </label>
    <div class="viz-row text-small text-muted" style="justify-content: space-between"><span data-label="slow">慢 · 0.25×</span><span data-label="fast">快 · 3×</span></div>
  </div>
  <div class="viz-row" style="justify-content: center"><button type="button" class="btn btn-primary" data-label="spinAgain">再转一次</button><span class="text-small text-muted wheel-chance"></span></div>
  <ol class="wheel-options"></ol>
  <script>
    (() => {
      let mounted = false;
      const mount = config => {
      if (mounted || !config || !Array.isArray(config.options) || !config.options.length || config.options.length > 100 || config.options.some(x => typeof x !== 'string' || !x.trim() || Array.from(x).length > 200) || !Number.isInteger(config.drawIndex) || config.drawIndex < 0 || config.drawIndex >= config.options.length || !Number.isFinite(config.speed) || typeof config.runId !== 'string') return;
      mounted = true;
      const root = document.getElementById('public-wheel');
      const english = config.locale === 'en';
      document.documentElement.lang = english ? 'en' : 'zh-CN';
      const labels = english
        ? {heading:'Let the wheel choose',ready:'Ready to spin…',wheelAria:'Equal-chance random wheel; the top pointer indicates the selected number',center:'Random pick',speed:'Speed',slow:'Slow · 0.25×',fast:'Fast · 3×',spinAgain:'Spin again',chance:(n,p)=>`${n} options · ${p}% chance each`,cannotRandom:'Secure random numbers are unavailable in this environment',selected:name=>`Selected: ${name}`,spinning:'Spinning…',start:'Click to start and choose an option at random',startButton:'Start spinning'}
        : {heading:'让转盘选一个',ready:'准备转动…',wheelAria:'等概率随机转盘，顶部指针指向选中的编号',center:'随机选择',speed:'转速',slow:'慢 · 0.25×',fast:'快 · 3×',spinAgain:'再转一次',chance:(n,p)=>`${n} 个选项 · 每项 ${p}%`,cannotRandom:'当前环境无法生成安全随机数',selected:name=>`这次选中：${name}`,spinning:'正在转动…',start:'点击开始，随机选一项',startButton:'开始转动'};
      root.querySelectorAll('[data-label]').forEach(el => { const key=el.dataset.label; el.textContent=labels[key]; });
      root.querySelectorAll('[data-label-attr]').forEach(el => { const [attr,key]=el.dataset.labelAttr.split(':'); el.setAttribute(attr,labels[key]); });
      const disc = root.querySelector('.wheel-disc');
      const result = root.querySelector('.wheel-result');
      const slider = root.querySelector('input');
      const output = root.querySelector('output');
      const button = root.querySelector('button');
      const list = root.querySelector('ol');
      const n = config.options.length, step = 360 / n;
      const ns = 'http://www.w3.org/2000/svg';
      let angle = 0, speed = config.speed, running = false, frame = 0;
      let selected = null, progress = 0, started = false;
      const point = (r, a) => [170 + r * Math.sin(a * Math.PI / 180), 170 - r * Math.cos(a * Math.PI / 180)];
      config.options.forEach((name, i) => {
        const wedge = document.createElementNS(ns, n === 1 ? 'circle' : 'path');
        if (n === 1) { wedge.setAttribute('cx', 170); wedge.setAttribute('cy', 170); wedge.setAttribute('r', 162); }
        else { const a = point(162, i * step), b = point(162, (i + 1) * step); wedge.setAttribute('d', `M170 170 L${a} A162 162 0 ${step > 180 ? 1 : 0} 1 ${b} Z`); }
        wedge.setAttribute('fill', i % 2 ? 'color-mix(in srgb, var(--foreground) 16%, var(--background))' : 'color-mix(in srgb, var(--foreground) 7%, var(--background))');
        wedge.setAttribute('stroke', 'var(--background)');
        wedge.setAttribute('stroke-width', '2');
        disc.append(wedge);
        if (n <= 30) {
          const label = document.createElementNS(ns, 'text'), p = point(132, (i + 0.5) * step);
          label.setAttribute('x', p[0]); label.setAttribute('y', p[1]); label.setAttribute('text-anchor', 'middle');
          label.setAttribute('dominant-baseline', 'middle'); label.setAttribute('fill', 'var(--foreground)');
          label.textContent = i + 1; disc.append(label);
        }
        const li = document.createElement('li'); li.textContent = `${i + 1}. ${name}`; list.append(li);
      });
      root.querySelector('.wheel-chance').textContent = labels.chance(n,(100 / n).toFixed(1));
      const paint = () => disc.setAttribute('transform', `rotate(${angle} 170 170)`);
      const snapshot = () => ({runId: config.runId, options: config.options, selected: selected === null ? null : config.options[selected], selectedIndex: selected, speed, running});
      function save() {
        const {options, ...state} = snapshot();
        window.dispatchEvent(new CustomEvent('random-wheel:state', {detail: state}));
        if (window.openai?.setWidgetState) Promise.resolve(window.openai.setWidgetState({modelContent: state, privateContent: {angle}})).catch(() => {});
      }
      function setSpeed(value, persist = true) {
        const parsed = Number(value); if (!Number.isFinite(parsed)) return;
        speed = Math.max(0.25, Math.min(3, parsed)); slider.value = speed; output.textContent = `${speed}×`;
        if (persist) save();
      }
      function finish(index) {
        selected = index; running = false; button.disabled = n === 1;
        button.textContent = labels.spinAgain;
        result.textContent = labels.selected(config.options[index]);
        [...list.children].forEach((li, i) => li.setAttribute('aria-current', String(i === index)));
      }
      function randomIndex() {
        const buffer = new Uint32Array(1), limit = Math.floor(4294967296 / n) * n;
        do { crypto.getRandomValues(buffer); } while (buffer[0] >= limit);
        return buffer[0] % n;
      }
      function spin(index) {
        if (running) return;
        if (index === undefined) {
          try { index = randomIndex(); } catch { result.textContent = labels.cannotRandom; return; }
        }
        if (!Number.isInteger(index) || index < 0 || index >= n) return;
        started = true; selected = null; running = true; progress = 0; button.disabled = true;
        result.textContent = labels.spinning;
        [...list.children].forEach(li => li.removeAttribute('aria-current'));
        save();
        const start = angle, target = ((360 - (index + 0.5) * step) % 360 + 360) % 360;
        const distance = 360 * 6 + ((target - start % 360 + 360) % 360);
        let previous = null;
        // Rotation is the requested interaction, not decorative motion.
        // Keep the selected speed meaningful even when the host reduces motion.
        function tick(now) {
          if (previous !== null) progress += Math.min(now - previous, 100) * speed / 6500;
          previous = now; progress = Math.min(progress, 1);
          angle = start + distance * (1 - Math.pow(1 - progress, 3)); paint();
          if (progress < 1 && n > 1) frame = requestAnimationFrame(tick);
          else { angle = target; paint(); finish(index); save(); }
        }
        frame = requestAnimationFrame(tick);
      }
      function restore(state) {
        const saved = state?.modelContent;
        if (saved?.runId !== config.runId) return;
        setSpeed(saved.speed, false);
        if (!saved.running && Number.isInteger(saved.selectedIndex) && saved.selectedIndex >= 0 && saved.selectedIndex < n) {
          cancelAnimationFrame(frame); started = true;
          angle = (360 - (saved.selectedIndex + 0.5) * step + 360) % 360; paint(); finish(saved.selectedIndex);
        }
      }
      setSpeed(speed, false); restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
      slider.addEventListener('input', () => setSpeed(slider.value));
      button.addEventListener('click', () => spin());
      window.randomWheel = {setSpeed, spin: () => spin(), getState: snapshot};
      if (config.autoStart === false && !started) {
        result.textContent = labels.start;
        button.textContent = labels.startButton;
      } else {
        const observer = new IntersectionObserver(entries => {
          if (entries.some(entry => entry.isIntersecting) && !started) { observer.disconnect(); spin(config.drawIndex); }
        });
        observer.observe(root);
      }
      };
      mount(__WHEEL_CONFIG__);
      window.addEventListener('random-wheel:config', event => mount(event.detail));
    })();
  </script>
</div>
</main></body>
</html>
