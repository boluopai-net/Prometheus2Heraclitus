<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="formation-path-desktop-title formation-path-desktop-desc" viewBox="0 0 800 770"><title id="formation-path-desktop-title">Steal Fire, Then Become Fire</title><desc id="formation-path-desktop-desc">A developmental aim runs through shared practice. Its trajectory and shared reflection prepare philosophical writing. Responses and opposition prompt reconstruction of understanding, premises, and relationships, which are distilled into models of person, counterpart, and relationship and used to build environments and works. New experience can revise desires and the developmental aim.</desc><style>
:root{--paper:#fff;--ink:#293537;--muted:#657575;--line:#698b89;--water:#245f64;--pale:#edf5f3;--fire:#a54d2c;--warm:#fff3e8;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#171e20;--ink:#e5eceb;--muted:#abb9b8;--line:#80a9a3;--water:#a1d8d0;--pale:#233a38;--fire:#edb18e;--warm:#3e2d25;color-scheme:dark}}
:root[data-theme=light]{--paper:#fff;--ink:#293537;--muted:#657575;--line:#698b89;--water:#245f64;--pale:#edf5f3;--fire:#a54d2c;--warm:#fff3e8;color-scheme:light}
:root[data-theme=dark]{--paper:#171e20;--ink:#e5eceb;--muted:#abb9b8;--line:#80a9a3;--water:#a1d8d0;--pale:#233a38;--fire:#edb18e;--warm:#3e2d25;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 12px}h1{font-size:clamp(26px,3.4vw,40px);line-height:1.4;margin:0 0 20px;text-align:center;font-weight:500}
svg{display:block;width:100%;height:auto;overflow:visible;font-family:inherit}svg text{font-family:inherit}.desktop svg{max-height:740px}.mobile{display:none}.embedded h1{display:none}.embedded main{padding:0}
@media(max-width:700px){.desktop{display:none}.mobile{display:block}main{padding:20px 0}h1{padding-inline:16px}}
</style><defs><marker id="formation-path-desktop-water" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--water)" stroke-width="1.5"/></marker><marker id="formation-path-desktop-fire" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--fire)" stroke-width="1.5"/></marker></defs><rect width="800" height="770" fill="var(--paper)"/><path d="M320.88 345.84000000000003 Q306 315 264.64 296.04" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#formation-path-desktop-water)"/><path d="M271 260 H529" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#formation-path-desktop-water)"/><path d="M635 366 V469" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#formation-path-desktop-water)"/><path d="M529 575 H271" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#formation-path-desktop-water)"/><path d="M249.8 511.4 Q288 460 321.8 437.84000000000003" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#formation-path-desktop-water)"/><path d="M550.2 323.6 Q520 332 478.2 342.15999999999997" fill="none" stroke="var(--fire)" stroke-width="2.3" stroke-dasharray="6 7" marker-end="url(#formation-path-desktop-fire)"/><path d="M165 469 V366" fill="none" stroke="var(--fire)" stroke-width="2.3" stroke-dasharray="6 7" marker-end="url(#formation-path-desktop-fire)"/><circle cx="165" cy="260" r="106" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="14" font-weight="400"><tspan x="165" y="182.0">UNDERSTANDING</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="26" font-weight="500"><tspan x="165" y="252.3">Lived</tspan><tspan x="165" y="287.7">trajectory</tspan></text><circle cx="635" cy="260" r="106" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="14" font-weight="400"><tspan x="635" y="182.0">ENCOUNTER</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="18" font-weight="500"><tspan x="635" y="257.8">Shared reflection</tspan><tspan x="635" y="282.2">Clarify pictures</tspan></text><circle cx="635" cy="575" r="106" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="14" font-weight="400"><tspan x="635" y="497.0">FORMATION</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="18" font-weight="500"><tspan x="635" y="560.5">Philosophy &amp; becoming</tspan><tspan x="635" y="585.0">Person &amp; counterpart</tspan><tspan x="635" y="609.5">Their relationship</tspan></text><circle cx="165" cy="575" r="106" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="14" font-weight="400"><tspan x="165" y="497.0">PRACTICE</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="18" font-weight="500"><tspan x="165" y="572.8">Environments &amp; works</tspan><tspan x="165" y="597.2">New encounters</tspan></text><circle cx="400" cy="390" r="92" fill="var(--paper)" stroke="var(--water)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="22" font-weight="500"><tspan x="400" y="375.0">Person + model</tspan><tspan x="400" y="405.0">Shared practice</tspan></text><rect x="265.8" y="282.8" width="78.3" height="24.5" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="305" y="295.0">Record</tspan></text><rect x="352.2" y="223.4" width="95.6" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="20" font-weight="400"><tspan x="400" y="237.0">Revisit</tspan></text><rect x="617.9" y="405.9" width="130.2" height="23.1" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="17" font-weight="400"><tspan x="683" y="417.5">Rearticulate</tspan></text><rect x="363.0" y="588.4" width="74.0" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="20" font-weight="400"><tspan x="400" y="602.0">Build</tspan></text><rect x="259.9" y="482.3" width="49.2" height="24.5" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="284.5" y="494.5">Use</tspan></text><rect x="517.5" y="368.4" width="75.1" height="23.1" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="17" font-weight="400"><tspan x="555" y="380.0">Revise</tspan></text><rect x="60.1" y="405.9" width="111.8" height="23.1" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="17" font-weight="400"><tspan x="116" y="417.5">Experience</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="400.0" y="25.0">STARTING POINT</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="28" font-weight="500"><tspan x="400.0" y="61.0">Join in stealing fire</tspan><tspan x="400.0" y="99.0">and cultivate yourself</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="17" font-weight="400"><tspan x="400.0" y="734.0">New experience can also change the original developmental aim.</tspan></text></svg>