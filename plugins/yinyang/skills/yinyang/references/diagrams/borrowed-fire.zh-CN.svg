<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="borrowed-fire-title borrowed-fire-desc" viewBox="0 0 920 244"><title id="borrowed-fire-title">参加窃火，用火培养自己</title><desc id="borrowed-fire-desc">造物进入世界 → 遭遇回应与阻力 → 改变理解、目的与参与 → 再次创造</desc><defs><marker id="borrowed-fire-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#245f64"/></marker></defs><rect width="920" height="244" fill="#fff"/><g font-family="system-ui,sans-serif"><path d="M176 104h32" stroke="#245f64" stroke-width="2" marker-end="url(#borrowed-fire-arrow)" fill="none"/><rect x="36" y="60" width="140" height="88" rx="4" fill="#f4f8f7" stroke="#bfd2ce"/><text x="106" y="88" text-anchor="middle" fill="#a54827" font-size="13">01</text><text x="106" y="121" text-anchor="middle" fill="#245f64" font-size="18">共同窃火</text><path d="M352 104h32" stroke="#245f64" stroke-width="2" marker-end="url(#borrowed-fire-arrow)" fill="none"/><rect x="212" y="60" width="140" height="88" rx="4" fill="#f4f8f7" stroke="#bfd2ce"/><text x="282" y="88" text-anchor="middle" fill="#a54827" font-size="13">02</text><text x="282" y="121" text-anchor="middle" fill="#245f64" font-size="18">带火入生活</text><path d="M528 104h32" stroke="#245f64" stroke-width="2" marker-end="url(#borrowed-fire-arrow)" fill="none"/><rect x="388" y="60" width="140" height="88" rx="4" fill="#f4f8f7" stroke="#bfd2ce"/><text x="458" y="88" text-anchor="middle" fill="#a54827" font-size="13">03</text><text x="458" y="121" text-anchor="middle" fill="#245f64" font-size="18">共同生成</text><path d="M704 104h32" stroke="#245f64" stroke-width="2" marker-end="url(#borrowed-fire-arrow)" fill="none"/><rect x="564" y="60" width="140" height="88" rx="4" fill="#f4f8f7" stroke="#bfd2ce"/><text x="634" y="88" text-anchor="middle" fill="#a54827" font-size="13">04</text><text x="634" y="121" text-anchor="middle" fill="#245f64" font-size="18">能力发展</text><rect x="740" y="60" width="140" height="88" rx="4" fill="#f4f8f7" stroke