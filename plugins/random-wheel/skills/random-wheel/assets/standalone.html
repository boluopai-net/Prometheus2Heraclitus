<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机转盘</title>
  <style>
    :root { color-scheme: light dark; --background: #ffffff; --foreground: #202124; --accent: #e6eefb; --muted-foreground: #60646c; --primary: #202124; --primary-foreground: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --background: #191b20; --foreground: #f0f1f3; --accent: #293a54; --muted-foreground: #b1b5bf; --primary: #f0f1f3; --primary-foreground: #191b20; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--background); color: var(--foreground); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 680px; margin: auto; }
    h3 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
    .viz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .text-small { font-size: 13px; }
    .text-muted { color: var(--muted-foreground); }
    .form-label { display: block; }
    .form-range { display: block; width: 100%; margin: 12px 0; accent-color: var(--foreground); min-height: 24px; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .btn { font: inherit; padding: 9px 18px; border: 0; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); }
    .btn:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body><main>__WHEEL_FRAGMENT__</main></body>
</html>
