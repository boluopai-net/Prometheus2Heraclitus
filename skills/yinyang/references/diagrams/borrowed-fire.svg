<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="borrowed-fire-desktop-title borrowed-fire-desktop-desc" viewBox="0 0 1000 790"><title id="borrowed-fire-desktop-title">Join in stealing fire, and use it to cultivate yourself</title><desc id="borrowed-fire-desktop-desc">People participate in collective fire-bringing, create with models, and encounter the world&#x27;s responses through their works. Participation can cultivate understanding, judgment, expression, and creation; developing capacities enable further creation. Works and environments can support development without being equivalent to it.</desc><style>
:root{--paper:#fff;--ink:#293537;--muted:#657575;--line:#698b89;--water:#245f64;--pale:#edf5f3;--fire:#a54d2c;--warm:#fff3e8;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#171e20;--ink:#e5eceb;--muted:#abb9b8;--line:#80a9a3;--water:#a1d8d0;--pale:#233a38;--fire:#edb18e;--warm:#3e2d25;color-scheme:dark}}
:root[data-theme=light]{--paper:#fff;--ink:#293537;--muted:#657575;--line:#698b89;--water:#245f64;--pale:#edf5f3;--fire:#a54d2c;--warm:#fff3e8;color-scheme:light}
:root[data-theme=dark]{--paper:#171e20;--ink:#e5eceb;--muted:#abb9b8;--line:#80a9a3;--water:#a1d8d0;--pale:#233a38;--fire:#edb18e;--warm:#3e2d25;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 12px}h1{font-size:clamp(26px,3.4vw,40px);line-height:1.4;margin:0 0 20px;text-align:center;font-weight:500}
svg{display:block;width:100%;height:auto;overflow:visible;font-family:inherit}svg text{font-family:inherit}.desktop svg{max-height:740px}.mobile{display:none}.embedded h1{display:none}.embedded main{padding:0}
@media(max-width:700px){.desktop{display:none}.mobile{display:block}main{padding:20px 0}h1{padding-inline:16px}}
</style><defs><marker id="borrowed-fire-desktop-water" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--water)" stroke-width="1.5"/></marker><marker id="borrowed-fire-desktop-fire" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="var(--fire)" stroke-width="1.5"/></marker></defs><rect width="1000" height="790" fill="var(--paper)"/><path d="M262 290H325" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#borrowed-fire-desktop-water)"/><path d="M675 290H738" fill="none" stroke="var(--fire)" stroke-width="2.3" stroke-dasharray="6 7" marker-end="url(#borrowed-fire-desktop-fire)"/><path d="M850 178C850 85 500 85 500 180" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#borrowed-fire-desktop-water)"/><path d="M500 400V492" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#borrowed-fire-desktop-water)"/><path d="M342 550C285 530 280 390 350 346" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#borrowed-fire-desktop-water)"/><path d="M664 584C850 584 850 500 850 402" fill="none" stroke="var(--fire)" stroke-width="2.3" stroke-dasharray="6 7" marker-end="url(#borrowed-fire-desktop-fire)"/><circle cx="150" cy="290" r="112" fill="var(--warm)" stroke="var(--fire)" stroke-width="1.3"/><g transform="translate(150 255) scale(0.9)"><path d="M0 24C-35 12-32-14-13-34C-9-11 5-17 3-52C42-15 41 15 12 24C20 5 8-2 3-13C2 4-9 7 0 24Z" fill="var(--fire)" opacity=".16"/><path d="M0 24C-35 12-32-14-13-34C-9-11 5-17 3-52C42-15 41 15 12 24" fill="none" stroke="var(--fire)" stroke-width="1.8"/></g><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="24" font-weight="500"><tspan x="150" y="309.7">Collective</tspan><tspan x="150" y="342.3">fire-bringing</tspan></text><ellipse cx="500" cy="290" rx="175" ry="110" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><circle cx="435" cy="265" r="43" fill="var(--paper)" stroke="var(--line)" stroke-width="1.3"/><circle cx="565" cy="265" r="43" fill="var(--paper)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="19" font-weight="500"><tspan x="435" y="265.0">Person</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="19" font-weight="500"><tspan x="565" y="265.0">Model</tspan></text><path d="M480 249 Q500 231 520 249" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#borrowed-fire-desktop-water)"/><path d="M520 281 Q500 299 480 281" fill="none" stroke="var(--water)" stroke-width="2.3" marker-end="url(#borrowed-fire-desktop-water)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="25" font-weight="500"><tspan x="500" y="346.0">Create together</tspan></text><circle cx="850" cy="290" r="112" fill="var(--warm)" stroke="var(--fire)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="20" font-weight="500"><tspan x="850" y="262.8">Human capacities</tspan><tspan x="850" y="290.0">Understand · judge</tspan><tspan x="850" y="317.2">Express · create</tspan></text><ellipse cx="500" cy="570" rx="170" ry="78" fill="var(--pale)" stroke="var(--line)" stroke-width="1.3"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--water)" font-size="20" font-weight="500"><tspan x="500" y="570.0">Works &amp; environments</tspan></text><rect x="240.8" y="250.4" width="106.4" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="20" font-weight="400"><tspan x="294" y="264.0">Use fire</tspan></text><rect x="652.3" y="251.8" width="107.5" height="24.5" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="18" font-weight="400"><tspan x="706" y="264.0">Cultivate</tspan></text><rect x="600.2" y="88.4" width="149.6" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="20" font-weight="400"><tspan x="675" y="102.0">Create again</tspan></text><rect x="510.4" y="433.4" width="63.2" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="20" font-weight="400"><tspan x="542" y="447.0">Make</tspan></text><rect x="209.0" y="443.8" width="156.1" height="24.5" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="18" font-weight="400"><tspan x="287" y="456.0">World responds</tspan></text><rect x="796.2" y="491.4" width="95.6" height="27.2" rx="5" fill="var(--paper)"/><text text-anchor="middle" dominant-baseline="middle" fill="var(--fire)" font-size="20" font-weight="400"><tspan x="844" y="505.0">Support</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="22" font-weight="500"><tspan x="500.0" y="704.0">Accumulated works are not the same as personal development.</tspan></text><text text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="16" font-weight="400"><tspan x="500.0" y="760.0">Dashed: cultivation or support, examined through actual participation.</tspan></text></svg>